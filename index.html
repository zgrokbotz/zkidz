<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a6fc2">
<title>ZKIDZ – Ocean Maze</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦦</text></svg>">
<link rel="stylesheet" href="style.css?v=20261116-7">
<script>
/* Safari 15 / iPadOS 15: CanvasRenderingContext2D.roundRect is Safari 16+. */
(function(){ var P=typeof CanvasRenderingContext2D!=='undefined' && CanvasRenderingContext2D.prototype; if(!P||P.roundRect) return;
  P.roundRect=function(x,y,w,h,r){ if(w<0){ x+=w; w=-w; } if(h<0){ y+=h; h=-h; }
    var rtl,rtr,rbr,rbl; if(typeof r==='number') rtl=rtr=rbr=rbl=r; else if(Array.isArray(r)){ rtl=r[0]||0; rtr=r[1]||r[0]||0; rbr=r[2]||r[0]||0; rbl=r[3]||r[1]||r[0]||0; } else rtl=rtr=rbr=rbl=0;
    var m=Math.min(w,h)/2; rtl=Math.min(Math.max(0,rtl),m); rtr=Math.min(Math.max(0,rtr),m); rbr=Math.min(Math.max(0,rbr),m); rbl=Math.min(Math.max(0,rbl),m);
    this.moveTo(x+rtl,y); this.lineTo(x+w-rtr,y); this.quadraticCurveTo(x+w,y,x+w,y+rtr); this.lineTo(x+w,y+h-rbr); this.quadraticCurveTo(x+w,y+h,x+w-rbr,y+h); this.lineTo(x+rbl,y+h); this.quadraticCurveTo(x,y+h,x,y+h-rbl); this.lineTo(x,y+rtl); this.quadraticCurveTo(x,y,x+rtl,y); this.closePath(); return this; };
})();
</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- LOBBY -->
<div id="lobby" class="screen">
  <div class="top-left profile" id="profileBtn">
    <div class="avatar"></div>
    <div><div class="pname" id="pname">PlayerOne</div><div class="trophy">🏆 <span id="trophies">0</span></div></div>
  </div>
  <div class="top-right currency"><button class="gear" id="gearBtn" title="Settings">⚙️</button><div class="pill"><span class="coin-ic" title="Starfish"></span><span class="coinCount">0</span></div></div>
  <div class="logo">ZKIDZ</div>
  <div class="side left">
    <button class="sq shop-sq" data-open="shop"><span class="shop-stand"><svg class="shop-svg" viewBox="0 0 64 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 8h52l-5 16H11L6 8z" fill="#fff4d6" stroke="#16163a" stroke-width="3" stroke-linejoin="round"/><path d="M14 8l4 16h9L23 8z" fill="#ff5b6c"/><path d="M36 8l4 16h9L45 8z" fill="#ff5b6c"/><path d="M6 8h52" fill="none" stroke="#16163a" stroke-width="3"/><circle cx="14" cy="22" r="3.2" fill="#fff4d6" stroke="#16163a" stroke-width="2"/><circle cx="26" cy="22" r="3.2" fill="#ff5b6c" stroke="#16163a" stroke-width="2"/><circle cx="38" cy="22" r="3.2" fill="#fff4d6" stroke="#16163a" stroke-width="2"/><circle cx="50" cy="22" r="3.2" fill="#ff5b6c" stroke="#16163a" stroke-width="2"/><rect x="12" y="28" width="40" height="20" rx="4" fill="#e39a3a" stroke="#16163a" stroke-width="3"/><rect x="20" y="32" width="24" height="10" rx="2" fill="#7fd6ff" stroke="#16163a" stroke-width="2"/><polygon points="32,4 34.2,8.6 39.2,9 35.4,12.4 36.5,17.2 32,14.6 27.5,17.2 28.6,12.4 24.8,9 29.8,8.6" fill="#ffc94a" stroke="#16163a" stroke-width="1.6" stroke-linejoin="round"/></svg></span>SHOP</button>
    <button class="sq" data-open="characters"><span>📖</span>CHARACTERS</button>
    <button class="sq" data-open="closet"><span>👕</span>CLOSET</button>
  </div>
  <div class="side right">
    <button class="sq" data-open="leaderboard"><span>🏆</span>LEADERBOARD</button>
    <button class="sq" data-open="chests"><span>🎁</span>CHESTS</button>
  </div>
  <div id="lobbyDock">
  <div class="modes">
    <button class="mode sel" data-mode="maze">MAZE</button>
    <button class="mode" data-mode="race">RACE</button>
    <button class="mode" data-mode="cards">MATCH CARDS</button>
    <button class="mode" data-mode="sort">REEF SORT</button>
    <button class="mode" data-mode="dash">REEF DINER</button>
    <button class="mode" data-mode="hide">HIDE &amp; SEEK</button>
  </div>
  <div id="playRow">
    <button id="playBtn" class="btn big">PLAY<small id="playSub">Maze · Level 1</small></button>
    <div id="lvlPick" class="lvlpick"><button class="lp-arrow" id="lvlDown" aria-label="Lower level">◀</button><div class="lp-mid"><span id="lvlKind">Level</span> <b id="lvlNum">1</b><small id="lvlOf"></small></div><button class="lp-arrow" id="lvlUp" aria-label="Higher level">▶</button></div>
  </div>
  <button id="lobbyProg" class="lobby-prog" type="button" aria-label="Progress: chests, collection and milestones">
    <div class="lpg-row"><span class="lpg-ic">🎁</span><div class="lpg-main"><div class="lpg-lbl" id="lpChestLbl">Chest in 0/5 games</div><div class="lpg-seg" id="lpChestBar"><i></i><i></i><i></i><i></i><i></i></div></div></div>
    <div class="lpg-row"><span class="lpg-ic">📖</span><div class="lpg-main"><div class="lpg-lbl" id="lpColLbl">Collection 1/59</div><div class="lpg-bar"><b id="lpColFill"></b></div></div></div>
    <div class="lpg-mile" id="lpMile">Next milestone</div>
  </button>
  </div>
</div>

<!-- PANELS -->
<div id="panel" class="screen hidden">
  <div class="panel-head"><button class="btn back" id="panelBack">◀</button><div class="panel-title" id="panelTitle">SHOP</div><div class="pill"><span class="coin-ic" title="Starfish"></span><span class="coinCount">0</span></div></div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- HUD -->
<div id="hud" class="screen hidden">
  <div class="lvl-badge"><small id="hudModeLbl">LEVEL</small><b id="hudLevel">1</b></div>
  <div class="hud-timer" id="hudTimer">00:00</div>
  <div class="hud-info" id="hudInfo"></div>
  <div class="top-right col">
    <div class="pill"><span class="coin-ic" title="Starfish"></span><span id="hudCoins">000</span></div>
    
    <button class="btn small" id="pauseBtn">⏸</button>
    <canvas id="minimap" width="160" height="160"></canvas>
  </div>
  <div id="joy"><div id="joyKnob"></div></div>
  <button id="dashBtn"><span></span></button>
  <div class="hint" id="hint">WASD / ↑↓ move · Mouse to look (click to lock) · Space = dash · Esc = pause</div>
  <div class="center-msg" id="centerMsg"></div>
</div>

<!-- CARDS -->
<div id="cards" class="screen hidden">
  <div class="cards-top">
    <button class="btn small" id="cardsQuit">◀</button>
    <div class="lvl-badge inline"><small>ROUND</small><b id="cardsRound">1</b></div>
    <div class="pill">⏱ <span id="cardsTime">0</span>s</div>
    <div class="pill">👆 <span id="cardsMoves">0</span></div>
    <div class="pill"><span class="coin-ic" title="Starfish"></span><span class="coinCount">0</span></div>
    
  </div>
  <div id="cardGrid"></div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="rotate">📱↻ Turn your phone sideways for the best fun!</div>
<div id="toast"></div>
<div id="musicBox" aria-hidden="true"></div>
<script type="module" src="game.js?v=20261116-7"></script>
</body>
</html>
